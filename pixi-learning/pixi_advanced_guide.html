    code: `// Sprite Pool — gaming_company level pattern
class SpritePool {
  constructor(texture, size = 20) {
    this.pool = [];
    // Pre-create sprites
    for (let i = 0; i < size; i++) {
      const sprite = new PIXI.Sprite(texture);
      sprite.visible = false;
      this.pool.push(sprite);
    }
  }

  // Pool se sprite lo
  get() {
    const sprite = this.pool.find(s => !s.visible);
    if (sprite) {
      sprite.visible = true;
      return sprite;
    }
    return null; // Pool full hai
  }

  // Sprite wapas karo
  release(sprite) {
    sprite.visible = false;
    sprite.x = 0;
    sprite.y = 0;
  }
}

// Use karo
const pool = new SpritePool(texture, 50);
const coin = pool.get();
// ... use karo
pool.release(coin); // Destroy nahi, reuse!`,

    code: `// Slot Reel — Basic Structure
class Reel {
  constructor(app, symbols, x) {
    this.container = new PIXI.Container();
    this.container.x = x;
    this.symbols = [];
    this.position = 0;
    this.speed = 0;
    this.isSpinning = false;

    // 5 symbols per reel
    for (let i = 0; i < 5; i++) {
      const symbol = new PIXI.Sprite(
        getRandomTexture(symbols)
      );
      symbol.y = i * 150; // 150px per symbol
      this.container.addChild(symbol);
      this.symbols.push(symbol);
    }

    app.stage.addChild(this.container);
  }

  // Spin shuru karo
  startSpin() {
    this.isSpinning = true;
    this.speed = 50; // pixels per frame
  }

  // Har frame update
  update() {
    if (!this.isSpinning) return;

    this.position += this.speed;

    // Symbols scroll karo
    this.symbols.forEach((symbol, i) => {
      symbol.y = (
        (this.position + i * 150) % (5 * 150)
      );
    });
  }

  // Stop karo target position pe
  stopAt(targetSymbol) {
    this.isSpinning = false;
    // Smooth stop logic yahan aayega
  }
}`,

const app = new PIXI.Application({
  width: 1280,
  height: 720,
  backgroundColor: 0x1a1a2e
});

// Delta time — frame rate independent movement
app.ticker.add((delta) => {

// FPS control — gaming_company standard 60fps
app.ticker.maxFPS = 60;

    concept: "Tween = smooth transition between two values. GSAP ya custom tween use hota hai.",
    code: `// Custom Tween — gaming_company mein GSAP bhi use hota hai
class Tween {
  constructor(target, props, duration, easing) {
    this.target = target;
    this.startProps = {};
    this.endProps = props;
    this.duration = duration;
    this.elapsed = 0;
    this.easing = easing || this.easeOut;
    this.done = false;

    // Start values save karo
    Object.keys(props).forEach(key => {
      this.startProps[key] = target[key];
    });
  }

  // Ease out — natural feel
  easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  update(delta) {
    if (this.done) return;
    this.elapsed += delta / 60;

    const progress = Math.min(
      this.elapsed / this.duration, 1
    );
    const eased = this.easing(progress);

    // Values interpolate karo
    Object.keys(this.endProps).forEach(key => {
      const start = this.startProps[key];
      const end = this.endProps[key];
      this.target[key] = start + (end - start) * eased;
    });

    if (progress >= 1) this.done = true;
  }
}

// Use karo — symbol bounce
const tween = new Tween(
  symbol,
  { y: symbol.y - 30, alpha: 0 },
  0.5
);`,

  {
    title: "Win Line Logic",

    gaming_company: "Slot game ka core — kaunsi line win hui yeh calculate karna!",
    concept: "Win lines = patterns on the grid. Check karo ki matching symbols kahan hain.",
    code: `// Win Line Calculator
const WIN_LINES = [
  [0,0, 1,0, 2,0, 3,0, 4,0], // Top row
  [0,1, 1,1, 2,1, 3,1, 4,1], // Middle row
  [0,2, 1,2, 2,2, 3,2, 4,2], // Bottom row
  [0,0, 1,1, 2,2, 3,1, 4,0], // V shape
  [0,2, 1,1, 2,0, 3,1, 4,2], // ^ shape
];

// Grid = 5 reels x 3 rows
function checkWins(grid, betPerLine) {
  const wins = [];

  WIN_LINES.forEach((line, lineIndex) => {
    const symbols = [];

    // Line ke symbols nikalo
    for (let i = 0; i < 5; i++) {
      const reel = line[i * 2];
      const row = line[i * 2 + 1];
      symbols.push(grid[reel][row]);
    }

    // Matching symbols count karo
    const firstSymbol = symbols[0];
    let matchCount = 1;

    for (let i = 1; i < 5; i++) {
      if (symbols[i] === firstSymbol || 
          symbols[i] === 'WILD') {
        matchCount++;
      } else break;
    }

    // 3+ match = win!
    if (matchCount >= 3) {
      const multiplier = getMultiplier(
        firstSymbol, matchCount
      );
      wins.push({
        lineIndex,
        symbol: firstSymbol,
        count: matchCount,
        payout: betPerLine * multiplier
      });
    }
  });

  return wins;
}`,
    tip: "WILD symbol sab ko replace karta hai — yeh logic zaroori hai!"

    concept: "State machine = game ki current state track karo. Ek state se doosri state mein transition.",
    code: `// Game State Machine
const STATES = {
  IDLE: 'IDLE',       // Spin button wait
  SPINNING: 'SPINNING', // Reels ghoom rahi hain
  STOPPING: 'STOPPING',  // Reels ruk rahi hain
  WIN: 'WIN',          // Win animation
  BONUS: 'BONUS',      // Bonus round
  FREE_SPIN: 'FREE_SPIN' // Free spins
};

class GameStateMachine {
  constructor() {
    this.state = STATES.IDLE;
    this.listeners = {};
  }

  // State change karo
  transition(newState) {
    const oldState = this.state;
    this.state = newState;

    console.log(\`\${oldState} → \${newState}\`);

    // Listeners notify karo
    this.emit(newState, oldState);
  }

  // State check karo
  is(state) {
    return this.state === state;
  }

  // Event system
  on(state, callback) {
    if (!this.listeners[state]) {
      this.listeners[state] = [];
    }
    this.listeners[state].push(callback);
  }

  emit(state, oldState) {
    (this.listeners[state] || [])
      .forEach(cb => cb(oldState));
  }
}

// Use karo
const game = new GameStateMachine();

game.on(STATES.WIN, () => {
  showWinAnimation();
  updateBalance();
});

// Spin button click
spinBtn.on('click', () => {
  if (game.is(STATES.IDLE)) {
    game.transition(STATES.SPINNING);
    startAllReels();
  }
});`,

  {

    levelText: "Medium",
    gaming_company: "Win pe coins girte hain, confetti — sab particles se hota hai!",
    concept: "Particles = bahut saare chhote sprites jo physics follow karte hain.",
    code: `// Particle System — Win Celebration
class ParticleSystem {
  constructor(app, texture) {
    this.app = app;
    this.texture = texture;
    this.particles = [];
    this.container = new PIXI.Container();
    app.stage.addChild(this.container);
  }

  // Particles emit karo
  emit(x, y, count = 20) {
    for (let i = 0; i < count; i++) {
      const particle = new PIXI.Sprite(this.texture);
      particle.x = x;
      particle.y = y;
      particle.scale.set(Math.random() * 0.5 + 0.3);

      // Random velocity
      particle.vx = (Math.random() - 0.5) * 10;
      particle.vy = (Math.random() - 1) * 15;
      particle.gravity = 0.5;
      particle.life = 1.0; // Full life
      particle.decay = Math.random() * 0.02 + 0.01;

      this.container.addChild(particle);
      this.particles.push(particle);
    }
  }

  // Har frame update
  update(delta) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];

      // Physics apply karo
      p.vy += p.gravity * delta;
      p.x += p.vx * delta;
      p.y += p.vy * delta;
      p.life -= p.decay * delta;
      p.alpha = p.life;

      // Dead particles remove karo
      if (p.life <= 0) {
        this.container.removeChild(p);
        this.particles.splice(i, 1);
      }
    }
  }
}

// Win pe use karo!
const coins = new ParticleSystem(app, coinTexture);
coins.emit(640, 360, 50); // Center pe 50 coins!`,
